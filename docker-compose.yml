version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fraud_postgres
    environment:
      POSTGRES_DB: fraud_detection
      POSTGRES_USER: changeme
      POSTGRES_PASSWORD: changeme
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U changeme -d fraud_detection"]
      interval: 5s
      timeout: 5s
      retries: 5

  mlflow:
    container_name: fraud_mlflow
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    command: >
      mlflow server
      --backend-store-uri postgresql://changeme:changeme@postgres:5432/mlflow_db
      --default-artifact-root /mlruns
      --host 0.0.0.0
      --port 5001
    environment:
      MLFLOW_TRACKING_URI: postgresql://changeme:changeme@postgres:5432/mlflow_db
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - mlflow_artifacts:/mlruns

  flask-api:
    container_name: fraud_flask_api
    build:
      context: .
      dockerfile: Dockerfile.flask
    env_file:
      - .env
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./models:/app/models:ro
      - ./src/api:/app/src/api:ro

volumes:
  postgres_data:
  mlflow_artifacts: