name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: fraud_detection
          POSTGRES_USER: changeme
          POSTGRES_PASSWORD: changeme
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements_api.txt
          pip install pytest pytest-cov

      - name: Download sample dataset
        run: |
          # Create sample test data for unit tests
          python -c "
          import pandas as pd
          import numpy as np
          np.random.seed(42)
          n = 1000
          data = {
              'Time': np.random.uniform(0, 172792, n),
              **{f'V{i}': np.random.randn(n) for i in range(1, 29)},
              'Amount': np.random.lognormal(4, 1.5, n),
              'Class': np.random.choice([0, 1], n, p=[0.99, 0.01])
          }
          pd.DataFrame(data).to_csv('creditcard.csv', index=False)
          "

      - name: Run preprocessing tests
        run: |
          python -c "
          from src.preprocess import preprocess_pipeline
          X_train, y_train, X_test, y_test, feature_cols = preprocess_pipeline('creditcard.csv')
          print(f'Train shape: {X_train.shape}')
          print(f'Test shape: {X_test.shape}')
          print(f'Features: {len(feature_cols)}')
          print(f'Train fraud rate: {y_train.mean():.4f}')
          print('✓ Preprocessing OK')
          "

      - name: Run model training tests
        run: |
          python -c "
          from src.preprocess import preprocess_pipeline
          from sklearn.ensemble import RandomForestClassifier
          from sklearn.metrics import roc_auc_score

          X_train, y_train, X_test, y_test, _ = preprocess_pipeline('creditcard.csv')
          model = RandomForestClassifier(n_estimators=10, max_depth=5, class_weight='balanced', random_state=42)
          model.fit(X_train, y_train)
          y_proba = model.predict_proba(X_test)[:, 1]
          auc = roc_auc_score(y_test, y_proba)
          print(f'ROC-AUC: {auc:.4f}')
          print('✓ Training OK')
          "

      - name: Run API tests
        run: |
          python -c "
          # Test imports
          from src.api.app import create_app
          from src.api.auth import validate_api_key
          from src.api.db import get_db_connection
          print('✓ API imports OK')

          # Test Flask app creation
          app = create_app()
          print('✓ Flask app creation OK')
          "

      - name: Run pytest
        env:
          SKIP_API_TESTS: '1'
        run: |
          pytest tests/ -v --tb=short

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create dummy model for build
        run: |
          mkdir -p models
          # Create a minimal dummy model file so COPY doesn't fail
          echo "dummy_model" > models/.gitkeep
          echo "Created dummy models directory for Docker build"

      - name: Build Docker images
        run: |
          docker build -f Dockerfile.flask -t fraud-detection-flask:test .
          docker build -f Dockerfile.mlflow -t fraud-detection-mlflow:test .
          echo "✓ Docker builds OK"

  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run safety check
        run: |
          pip install safety
          safety check --json-file-path safety-report.json 2>/dev/null || safety check 2>/dev/null || echo "Safety check skipped"
        continue-on-error: true