name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: fraud_detection
          POSTGRES_USER: change_user
          POSTGRES_PASSWORD: change_pass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements_api.txt
          pip install -r requirements_test.txt

      - name: Create sample dataset
        run: |
          python -c "
          import pandas as pd
          import numpy as np
          np.random.seed(42)
          n = 2000
          data = {
              'Time': np.random.uniform(0, 172792, n),
              **{f'V{i}': np.random.randn(n) for i in range(1, 29)},
              'Amount': np.random.lognormal(4, 1.5, n),
              'Class': np.random.choice([0, 1], n, p=[0.99, 0.01])
          }
          pd.DataFrame(data).to_csv('creditcard.csv', index=False)
          "
          echo "Created sample dataset with $(wc -l < creditcard.csv) rows"

      - name: Run pytest with coverage
        env:
          SKIP_API_TESTS: '0'
          DATABASE_URL: 'postgresql://change_user:change_pass@localhost:5432/fraud_detection'
        run: |
          pytest tests/ \
            --cov=src \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            -v \
            --tb=short

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: true
        continue-on-error: true

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create dummy model for build
        run: |
          mkdir -p models
          echo "placeholder for docker build" > models/.gitkeep

      - name: Build Docker images
        run: |
          docker build -f Dockerfile.flask -t fraud-detection-flask:test .
          docker build -f Dockerfile.mlflow -t fraud-detection-mlflow:test .
          echo "✓ Docker builds OK"

  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run safety check
        run: |
          pip install safety
          safety check --json-file-path safety-report.json 2>/dev/null || safety check 2>/dev/null || echo "Safety check skipped"
        continue-on-error: true

  integration-tests:
    runs-on: ubuntu-latest
    needs: lint-and-test

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: fraud_detection
          POSTGRES_USER: change_user
          POSTGRES_PASSWORD: change_pass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements_api.txt
          pip install -r requirements_test.txt

      - name: Wait for PostgreSQL to be ready
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -U change_user -d fraud_detection && break
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done

      - name: Run integration tests
        env:
          DATABASE_URL: 'postgresql://change_user:change_pass@localhost:5432/fraud_detection'
          RUN_INTEGRATION_TESTS: '1'
          POSTGRES_HOST: 'localhost'
          POSTGRES_PORT: '5432'
        run: |
          pytest tests/integration/ -v --tb=short